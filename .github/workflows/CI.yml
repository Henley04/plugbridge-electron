name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    env:
      # Backwards-compatible macOS binaries (binding.gyp also sets this in xcode_settings;
      # the env var makes it visible to node-gyp during the install-script fallback build).
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions runner availability (as of 2026):
        #   - windows-latest         → x64  (win32-x64)  ✓ available
        #   - windows-11-arm         → arm64 (win32-arm64) public preview
        #   - macos-14 / macos-15    → arm64 (darwin-arm64) ✓ available
        #   - macos-13 (Intel x64)  → DEPRECATED — GitHub removed Intel macOS
        #                              runners in late 2025. darwin-x64 prebuilds
        #                              can only be produced via cross-compilation
        #                              (e.g. `arch -x86_64` on an arm64 host),
        #                              which is not viable in CI. Users on Intel
        #                              Macs must build from source with a local
        #                              toolchain.
        #   - ubuntu-latest          → x64  (linux-x64)  ✓ available
        #   - ubuntu-24.04-arm       → arm64 (linux-arm64) ✓ available (GA)
        #
        # win32-ia32 (32-bit Windows) is NOT supported — no GitHub runner
        # produces 32-bit Windows binaries, and modern VST3 plugins are
        # universally 64-bit anyway.
        include:
          - os: windows-latest
            arch: x64
            artifact_name: prebuilds-win32-x64
          - os: macos-14
            arch: arm64
            artifact_name: prebuilds-darwin-arm64
          - os: ubuntu-latest
            arch: x64
            artifact_name: prebuilds-linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: prebuilds-linux-arm64

    steps:
      - name: Checkout (with VST3 SDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3 (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev libstdc++-13-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon from source
        run: npm run build

      - name: Verify addon loads
        run: node -e "const v = require('./').version(); console.log(JSON.stringify(v)); if(!v.native) process.exit(1)"

      - name: Build test plugin (Gain.vst3)
        run: npm run test:plugin

      - name: Run integration tests
        run: npm test

      - name: Run VST3 Validator on test plugin (Linux x64 only)
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          # Validate the test plugin using the SDK's validator if available.
          # This catches VST3 spec compliance issues that the runtime tests
          # do not exercise (e.g. parameter value ranges, bus activation
          # transitions, message handling edge cases).
          if command -v validator >/dev/null 2>&1; then
            validator "$PWD/test/plugin/build/Gain.vst3"
          else
            echo "VST3 validator binary not on PATH — skipping (install Steinberg VST3 SDK validator to enable)"
          fi

      - name: Create prebuilds
        run: npx prebuildify --napi-version 8 --tag-armv -t 20.0.0

      - name: Upload prebuilds artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: prebuilds/
          if-no-files-found: error

  release:
    name: Release to npm & GitHub
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The `release` environment is required to match the npm Trusted Publisher
    # configuration (org: Henley04, repo: plugbridge-electron, workflow: CI.yml,
    # environment: release). Configure at:
    # https://www.npmjs.com/package/plugbridge-electron/access
    # Trusted publishing (npm provenance) uses GitHub Actions' OIDC token
    # instead of a long-lived NPM_TOKEN. Requires `id-token: write`.
    # `contents: write` is needed to create the GitHub Release.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted publishing requires Node.js >= 22.14.0 and npm CLI >= 11.5.1.
      # IMPORTANT: do NOT set `registry-url` here. Setting it makes
      # actions/setup-node write an .npmrc that pulls auth from NODE_AUTH_TOKEN,
      # which shadows the OIDC flow and causes 404 on publish. With id-token:
      # write permission and no .npmrc token, `npm publish --provenance` will
      # authenticate via the OIDC token issued by GitHub Actions.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true

      - name: Verify all platform prebuilds are present
        run: |
          echo "Prebuilds contents:"
          find prebuilds -type f | sort
          echo
          count=$(find prebuilds -type f -name '*.node' | wc -l)
          echo "Found $count .node file(s) (expected >= 4)"
          if [ "$count" -lt 4 ]; then
            echo "ERROR: Expected at least 4 prebuild .node files (win32-x64, darwin-arm64, linux-x64, linux-arm64), found $count"
            exit 1
          fi

      # Dual-mode publish:
      # - First release (package does not exist on npm yet): NPM_TOKEN secret
      #   must be present. We write a temporary .npmrc and publish WITHOUT
      #   --provenance, because provenance requires the package to already
      #   exist on npm with Trusted Publisher configured.
      # - Subsequent releases: remove the NPM_TOKEN secret from the repo
      #   (Settings → Secrets and variables → Actions). The job then falls
      #   back to OIDC trusted publishing via `--provenance`.
      # After the first successful release, configure Trusted Publisher at
      # https://www.npmjs.com/package/plugbridge-electron/access and delete
      # the NPM_TOKEN secret to switch to tokenless publishing.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN (first release — provenance disabled until Trusted Publisher is configured)"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            npm publish --access public
          else
            echo "Publishing with OIDC trusted publishing (--provenance)"
            npm publish --provenance --access public
          fi

      - name: Create prebuilds tarball
        run: tar -czf evst3-prebuilds-${{ github.ref_name }}.tar.gz prebuilds/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: evst3-prebuilds-${{ github.ref_name }}.tar.gz
